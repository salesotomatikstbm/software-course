<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="keywords" content="Otomatiks, Education, Online Course">
  <meta name="description" content="Otomatiks - Education & Online Course">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otomatiks - Secure Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    
    .login-container {
      max-width: 440px;
      width: 100%;
    }
    
    .card {
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      border: none;
    }
    
    .card-header {
      background: linear-gradient(120deg, #2575fc 0%, #6a11cb 100%);
      color: white;
      text-align: center;
      padding: 25px 20px;
      border-bottom: none;
    }
    
    .card-body {
      padding: 30px;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      color: #2575fc;
    }
    
    .form-control {
      border-radius: 8px;
      padding: 12px 16px;
      border: 2px solid #eef2f7;
      transition: all 0.3s;
    }
    
    .form-control:focus {
      border-color: #2575fc;
      box-shadow: 0 0 0 0.25rem rgba(37, 117, 252, 0.25);
    }
    
    .btn-login {
      background: linear-gradient(120deg, #2575fc 0%, #6a11cb 100%);
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(37, 117, 252, 0.4);
    }
    
    .error-message {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="card">
      <div class="card-header">
        <div class="logo">O</div>
        <h4 class="mb-0">Secure Login</h4>
        <p class="mb-0">Access Otomatiks Course Portal</p>
      </div>
      <div class="card-body">
        <div id="error-message" class="error-message alert alert-danger"></div>
        
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" required autocomplete="off" placeholder="Enter your username">
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required autocomplete="off" placeholder="Enter your password">
          </div>
          <button type="submit" class="btn btn-login w-100">Login to Portal</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS and Popper.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/js/animation.js"></script>

  <!-- Animation CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</body>

</html>

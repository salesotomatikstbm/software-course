    <p>Edit the code below and practice:</p>

    <textarea id="codeArea" style="width:100%; height:500px; font-family: monospace; font-size:14px;">

import tkinter as tk

window = tk.Tk()
window.title("Simple Quiz App")
window.geometry("500x400")

score = 0

def show_question1():
    print("Question 1: What is the capital of India?")
    print("1. Mumbai")
    print("2. Chennai")
    print("3. New Delhi")
    print("4. Kolkata")

    answer = input("Enter your choice (1-4): ")

    global score
    if answer == "3":
        print("Correct Answer!")
        score += 1
    else:
        print("Wrong Answer! Correct Answer is New Delhi")

def show_question2():
    print("Question 2: How many sides does a triangle have?")
    print("1. 2")
    print("2. 3")
    print("3. 4")
    print("4. 5")

    answer = input("Enter your choice (1-4): ")

    global score
    if answer == "2":
        print("Correct Answer!")
        score += 1
    else:
        print("Wrong Answer! Correct Answer is 3")

show_question1()
show_question2()

print("Your Score is:", score, "/ 2")

    </textarea>

    <br><br>

    <button onclick="downloadCode()">Download Code</button>

    <script>
        function downloadCode() {
            var code = document.getElementById("codeArea").value;
            var blob = new Blob([code], { type: "text/plain" });
            var link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "quiz_app.py";
            link.click();
        }
    </script>

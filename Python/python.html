<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Python Programming Course Curriculum</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary: #4D96FF; /* Python blue */
      --secondary: #FF9F1C; /* Accent orange */
      --dark: #212529;
      --light: #F7F9FC;
      --card-bg: #FFFFFF;
    }

    body {
      font-family: 'Baloo 2', cursive;
      background-color: var(--light);
      color: var(--dark);
      margin: 0;
      text-align: center;
      background-image: radial-gradient(circle at 10% 20%, rgba(77, 150, 255, 0.1) 0%, rgba(77, 150, 255, 0.05) 90%);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 40px 0;
      margin-bottom: 40px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    header::before,
    header::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
    }

    header::before {
      top: -50px;
      right: -50px;
      width: 200px;
      height: 200px;
    }

    header::after {
      bottom: -80px;
      left: -80px;
      width: 300px;
      height: 300px;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
    }

    p.subtitle {
      font-size: 1.3rem;
      margin-top: 15px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    .button-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      margin-top: 40px;
      padding: 0 20px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--card-bg);
      color: var(--dark);
      padding: 30px 20px;
      border-radius: 15px;
      text-decoration: none;
      font-size: 1.2rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      border: 3px solid transparent;
      min-height: 150px;
      position: relative;
      overflow: hidden;
    }

    .nav-btn i {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: var(--primary);
      transition: all 0.3s ease;
    }

    .nav-btn:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15);
      border-color: var(--primary);
    }

    .nav-btn:hover i {
      color: var(--secondary);
      transform: scale(1.1);
    }

    .nav-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 5px;
      width: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }
      p.subtitle {
        font-size: 1rem;
      }
      .nav-btn {
        min-height: 120px;
        padding: 20px 15px;
      }
      .nav-btn i {
        font-size: 2rem;
      }
    }

    /* Password Modal */
    .password-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(33, 37, 41, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.5s ease forwards;
    }

    .password-box {
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .password-box::before,
    .password-box::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      opacity: 0.1;
    }

    .password-box::before {
      top: -50px; right: -50px;
      width: 150px; height: 150px;
      background: var(--primary);
    }

    .password-box::after {
      bottom: -50px; left: -50px;
      width: 200px; height: 200px;
      background: var(--secondary);
    }

    .password-box h2 {
      margin: 0 0 10px 0;
      color: var(--primary);
      font-size: 1.8rem;
    }

    .password-box p {
      margin-bottom: 25px;
      opacity: 0.8;
    }

    .password-input {
      width: 80%;
      max-width: 250px;
      padding: 14px 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      transition: border 0.3s, box-shadow 0.3s;
      margin-bottom: 20px;
    }

    .password-input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(77, 150, 255, 0.2);
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 14px 35px;
      border-radius: 50px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <h1>Python Programming Course</h1>
      <p class="subtitle">A fun, practical coding adventure for curious minds</p>
    </div>
  </header>

  <div class="container">
    <div class="button-container">
      <a href="./course-overview.html" class="nav-btn">
        <i class="fas fa-map"></i>
        Course Overview
      </a>
      <a href="./course-module.html" class="nav-btn">
        <i class="fas fa-book-open"></i>
        Course Modules
      </a>
        <a href="./day-order.html" class="nav-btn">
        <i class="fas fa-calendar-alt"></i>
        Day Order
      </a>
      <a href="./course_project.html" class="nav-btn">
        <i class="fas fa-laptop-code"></i>
        Projects
      </a>
    
    
    </div>
  </div>

  <!-- Password Modal -->
  <div class="password-modal" id="passwordModal">
    <div class="password-box">
      <h2><i class="fas fa-lock"></i> Enter Password</h2>
      <p>Please enter the password to access the curriculum</p>
      <input type="password" class="password-input" id="passwordInput" placeholder="Enter password">
      <button class="submit-btn" id="submitPassword">Submit</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const passwordModal = document.getElementById('passwordModal');
      const passwordInput = document.getElementById('passwordInput');
      const submitBtn = document.getElementById('submitPassword');

      if (sessionStorage.getItem('pythonVerified') === 'true') {
        passwordModal.style.display = 'none';
      } else {
        passwordModal.style.display = 'flex';
      }

      submitBtn.addEventListener('click', function() {
        const encodedPasswords = ["cWJlZWFjYWRlbXk="];
        const input = passwordInput.value;
        const encodedInput = btoa(input);

        if (encodedPasswords.includes(encodedInput)) {
          sessionStorage.setItem('pythonVerified', 'true');
          passwordModal.style.display = 'none';
        } else {
          alert("Incorrect password. Please try again.");
          passwordInput.value = '';
          passwordInput.focus();
        }
      });

      passwordInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          submitBtn.click();
        }
      });
    });
  </script>
</body>
</html>
